<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>9Cloud — Team Tasks Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-1: #0c1222;
      --bg-2: #1a1f35;
      --panel: rgba(255,255,255,0.045);
      --line: rgba(255,255,255,0.08);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --faint: #64748b;
      --cyan: #06b6d4;
      --violet: #8b5cf6;
      --red: #f87171;
      --amber: #fbbf24;
      --slate: #a5b4fc;
      --pink: #f472b6;
      --grey: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .dashboard { max-width: 1240px; margin: 0 auto; padding: 20px; }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .header h1 {
      font-size: 24px; font-weight: 700;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header-sub { color: var(--faint); font-size: 13px; margin-top: 2px; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .last-updated { font-size: 11px; color: #475569; }

    .btn {
      padding: 8px 18px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #fff; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-ghost {
      background: transparent; color: var(--muted);
      border: 1px solid var(--line);
    }
    .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--cyan); outline-offset: 2px;
    }

    /* Count tiles — each one is a filter */
    .tiles {
      display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px; margin-bottom: 20px;
    }
    .tile {
      text-align: left; cursor: pointer; font-family: inherit; color: var(--text);
      background: var(--panel); border: 1px solid var(--line);
      border-left: 3px solid var(--tile-color, var(--faint));
      border-radius: 10px; padding: 12px 14px;
    }
    .tile:hover { background: rgba(255,255,255,0.07); }
    .tile.active { background: rgba(255,255,255,0.1); border-color: var(--tile-color); }
    .tile-num { font-size: 26px; font-weight: 700; line-height: 1.1; color: var(--tile-color, var(--text)); }
    .tile-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Filters */
    .filters {
      display: flex; align-items: flex-end; flex-wrap: wrap; gap: 14px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--line);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
    }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-group.grow { flex: 1 1 220px; }
    .filter-label { font-size: 12px; font-weight: 600; color: var(--faint); }
    select, input[type="search"] {
      padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
      background: var(--bg-2); color: var(--text); font-family: inherit; font-size: 13px;
      min-width: 160px; color-scheme: dark;
    }
    input[type="search"] { width: 100%; }

    /* Two-up row: people chart + projects */
    .grid-2 { display: grid; grid-template-columns: 3fr 2fr; gap: 20px; margin-bottom: 20px; }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 18px 20px; min-width: 0;
    }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .card-sub { font-size: 12px; color: var(--faint); margin-bottom: 14px; }

    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

    .proj-row {
      width: 100%; display: grid; grid-template-columns: 1fr auto auto; gap: 12px;
      align-items: center; padding: 8px 6px; border: none; background: none;
      color: var(--text); font-family: inherit; font-size: 13px; text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; border-radius: 6px;
    }
    .proj-row:hover { background: rgba(255,255,255,0.04); }
    .proj-row.active { background: rgba(6,182,212,0.12); }
    .proj-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .proj-company { color: var(--faint); font-size: 11.5px; }
    .proj-num { font-variant-numeric: tabular-nums; font-size: 12.5px; min-width: 64px; text-align: right; }
    .proj-num.red { color: var(--red); }
    .proj-num.dim { color: var(--muted); }

    /* Task table */
    .table-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 20px; }
    .table-head {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 16px 20px; border-bottom: 1px solid var(--line);
    }
    .table-head .card-title { margin: 0; }
    .active-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; font-size: 12px; font-weight: 600; color: var(--faint);
      padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap;
    }
    td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: top; }
    tr:hover td { background: rgba(255,255,255,0.025); }
    .task-link { color: var(--text); text-decoration: none; font-weight: 500; }
    .task-link:hover { color: var(--cyan); text-decoration: underline; }
    .task-list { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
    .cell-muted { color: var(--muted); }
    .nowrap { white-space: nowrap; }
    .late { color: var(--red); font-weight: 600; }
    .soon { color: var(--amber); font-weight: 600; }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      border: 1px solid currentColor; white-space: nowrap;
    }
    .chip.overdue { color: var(--red); }
    .chip.soon { color: var(--amber); }
    .chip.stale { color: var(--slate); }
    .chip.unassigned { color: var(--pink); }
    .chip.nodue { color: var(--grey); }

    .table-foot { display: flex; justify-content: center; padding: 14px; }
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

    .loading-state { display: flex; flex-direction: column; align-items: center; padding: 80px 20px; gap: 16px; }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--cyan);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
    .loading-text { color: var(--faint); font-size: 14px; }

    .banner { border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; font-size: 13px; line-height: 1.5; }
    .banner.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; }
    .banner.warn { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25); color: #fde68a; }
    .banner code { background: rgba(0,0,0,0.3); padding: 1px 6px; border-radius: 4px; font-size: 12px; }

    .footer { text-align: center; padding: 20px; font-size: 12px; color: #475569; }
    .footer span { color: var(--cyan); }

    @media (max-width: 1100px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
    @media (max-width: 600px) {
      .dashboard { padding: 12px; }
      .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .filters { flex-direction: column; align-items: stretch; }
      .filter-group.grow { flex: none; }
      select { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.1.16/umd/Recharts.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;
    const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

    const API_BASE = '/api/teamwork';
    const TEAMWORK_DOMAIN = 'https://9cloudwebworks.teamwork.com';

    // Same roster as the hours dashboard. Tasks assigned to anyone on this
    // list (or to nobody) are "the team's" tasks.
    const STAFF = [
      { id: 90852,  label: 'Mary Lynn' },
      { id: 109919, label: 'Salim' },
      { id: 608372, label: 'Isha' },
      { id: 360446, label: 'Nusrat' },
      { id: 360448, label: 'Ashraf' },
      { id: 610444, label: 'Carina' },
      { id: 593117, label: 'Gerard' },
      { id: 205276, label: 'Mark' },
      { id: 90854,  label: 'Anne Katherine' },
      { id: 216554, label: 'Wasim' },
      { id: 577282, label: 'Pankaj' },
    ];
    const STAFF_BY_ID = Object.fromEntries(STAFF.map(s => [s.id, s.label]));
    const UNASSIGNED = 'unassigned';

    const DUE_SOON_DAYS = 2;          // today + next 2 days
    const DEFAULT_STALE_DAYS = 7;     // changeable in the page
    const PAGE_CHUNK = 50;            // rows shown per "Show more"

    const COLORS = { overdue: '#f87171', soon: '#fbbf24', other: '#334155' };

    function taskUrl(id) { return `${TEAMWORK_DOMAIN}/app/tasks/${id}`; }

    function api(endpoint, params = {}) {
      const query = new URLSearchParams({ endpoint, ...params });
      return fetch(`${API_BASE}?${query}`).then(async r => {
        if (!r.ok) {
          let msg = `API ${r.status}`;
          try { const j = await r.json(); if (j.error) msg += ` — ${j.error}`; } catch {}
          throw new Error(msg);
        }
        return r.json();
      });
    }

    async function fetchAllPages(endpoint, key, params = {}, onProgress) {
      const first = await api(endpoint, { ...params, page: '1', pageSize: '250' });
      let all = first[key] || [];
      const totalPages = (first._pagination && first._pagination.pages) || 1;
      if (onProgress) onProgress(1, totalPages);
      for (let start = 2; start <= totalPages; start += 5) {
        const end = Math.min(start + 4, totalPages);
        const batch = [];
        for (let p = start; p <= end; p++) batch.push(api(endpoint, { ...params, page: String(p), pageSize: '250' }));
        (await Promise.all(batch)).forEach(r => { all = all.concat(r[key] || []); });
        if (onProgress) onProgress(end, totalPages);
      }
      return all;
    }

    // ---------- Date helpers ----------
    function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
    // Teamwork v1 dates come as "YYYYMMDD" (empty string when not set).
    function parseTwDate(v) {
      if (!v) return null;
      const s = String(v);
      if (/^\d{8}$/.test(s)) return new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
      const d = new Date(s);
      return isNaN(d) ? null : startOfDay(d);
    }
    function parseIso(v) { if (!v) return null; const d = new Date(v); return isNaN(d) ? null : d; }
    const DAY = 86400000;
    function daysBetween(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / DAY); }
    function fmtShort(d) { return d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—'; }

    // ---------- Normalise one Teamwork v1 task ----------
    function normalise(t) {
      const idsRaw = t['responsible-party-ids'] ?? t['responsible-party-id'] ?? '';
      const assigneeIds = String(idsRaw).split(',').map(s => Number(s.trim())).filter(n => n > 0);
      const rawNames = String(t['responsible-party-names'] || t['responsible-party-summary'] || '')
        .split('|').map(s => s.trim()).filter(Boolean);
      const assigneeNames = assigneeIds.length
        ? assigneeIds.map((id, i) => STAFF_BY_ID[id] || rawNames[i] || `#${id}`)
        : [];
      return {
        id: t.id,
        name: t.content || t.name || 'Untitled task',
        projectId: t['project-id'],
        projectName: t['project-name'] || 'No project',
        company: t['company-name'] || '',
        listName: t['todo-list-name'] || '',
        assigneeIds,
        assigneeNames,
        due: parseTwDate(t['due-date']),
        lastChanged: parseIso(t['last-changed-on']),
        column: (t.boardColumn && t.boardColumn.name) || '',
        completed: t.completed === true || t.status === 'completed',
      };
    }

    function TeamTasksDashboard() {
      const [raw, setRaw] = useState([]);
      const [loading, setLoading] = useState(false);
      const [loadingMsg, setLoadingMsg] = useState('');
      const [error, setError] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);

      const [view, setView] = useState('attention');
      const [person, setPerson] = useState('all');
      const [project, setProject] = useState('all');
      const [search, setSearch] = useState('');
      const [staleDays, setStaleDays] = useState(DEFAULT_STALE_DAYS);
      const [shown, setShown] = useState(PAGE_CHUNK);

      const fetchData = useCallback(async () => {
        setLoading(true); setError(null);
        try {
          setLoadingMsg('Loading open tasks…');
          const items = await fetchAllPages(
            'tasks.json', 'todo-items',
            { includeCompletedTasks: 'false' },
            (p, t) => setLoadingMsg(`Loading open tasks… page ${p} of ${t}`)
          );
          setRaw(items);
          setLastUpdated(new Date());
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false); setLoadingMsg('');
        }
      }, []);

      useEffect(() => { fetchData(); }, [fetchData]);
      useEffect(() => { setShown(PAGE_CHUNK); }, [view, person, project, search, staleDays]);

      // ---------- Derive flags ----------
      const { tasks, outsideCount, fieldWarning } = useMemo(() => {
        const today = startOfDay(new Date());
        const all = raw.map(normalise).filter(t => !t.completed);
        let outside = 0;
        const team = [];
        all.forEach(t => {
          const onRoster = t.assigneeIds.some(id => STAFF_BY_ID[id]);
          if (!onRoster && t.assigneeIds.length) { outside++; return; }
          const daysToDue = t.due ? daysBetween(today, t.due) : null;
          const idle = t.lastChanged ? daysBetween(t.lastChanged, today) : null;
          const f = {
            overdue: daysToDue !== null && daysToDue < 0,
            soon: daysToDue !== null && daysToDue >= 0 && daysToDue <= DUE_SOON_DAYS,
            nodue: !t.due,
            unassigned: t.assigneeIds.length === 0,
            stale: idle !== null && idle >= staleDays,
          };
          f.attention = f.overdue || f.soon || f.stale || f.unassigned;
          // Higher = worse; used for default sort.
          const severity = f.overdue ? 4000 + (-daysToDue) : f.soon ? 3000 - daysToDue
            : f.stale ? 2000 + idle : f.unassigned ? 1000 : 0;
          team.push({ ...t, flags: f, daysToDue, idle, severity });
        });
        const noAssigneeData = all.length > 20 && all.every(t => t.assigneeIds.length === 0);
        const noDateData = all.length > 20 && all.every(t => !t.due && !t.lastChanged);
        return {
          tasks: team,
          outsideCount: outside,
          fieldWarning: noAssigneeData || noDateData,
        };
      }, [raw, staleDays]);

      // Person / project / search narrow everything; the tile picks the flag.
      const scoped = useMemo(() => {
        const q = search.trim().toLowerCase();
        return tasks.filter(t => {
          if (person === UNASSIGNED && !t.flags.unassigned) return false;
          if (person !== 'all' && person !== UNASSIGNED && !t.assigneeIds.includes(Number(person))) return false;
          if (project !== 'all' && String(t.projectId) !== project) return false;
          if (q && !(`${t.name} ${t.projectName} ${t.company} ${t.listName}`.toLowerCase().includes(q))) return false;
          return true;
        });
      }, [tasks, person, project, search]);

      const counts = useMemo(() => {
        const c = { attention: 0, overdue: 0, soon: 0, stale: 0, nodue: 0, unassigned: 0, all: scoped.length };
        scoped.forEach(t => { ['attention', 'overdue', 'soon', 'stale', 'nodue', 'unassigned'].forEach(k => { if (t.flags[k]) c[k]++; }); });
        return c;
      }, [scoped]);

      const rows = useMemo(() => {
        const list = view === 'all' ? scoped : scoped.filter(t => t.flags[view]);
        return [...list].sort((a, b) => b.severity - a.severity
          || (a.due ? a.due.getTime() : Infinity) - (b.due ? b.due.getTime() : Infinity));
      }, [scoped, view]);

      // People chart ignores the person filter so you can compare everyone.
      const peopleData = useMemo(() => {
        const base = tasks.filter(t => project === 'all' || String(t.projectId) === project);
        const map = {};
        STAFF.forEach(s => { map[s.id] = { id: String(s.id), name: s.label, overdue: 0, soon: 0, other: 0, total: 0 }; });
        map[UNASSIGNED] = { id: UNASSIGNED, name: 'Unassigned', overdue: 0, soon: 0, other: 0, total: 0 };
        base.forEach(t => {
          const keys = t.flags.unassigned ? [UNASSIGNED] : t.assigneeIds.filter(id => map[id]);
          keys.forEach(k => {
            const m = map[k];
            m.total++;
            if (t.flags.overdue) m.overdue++; else if (t.flags.soon) m.soon++; else m.other++;
          });
        });
        return Object.values(map).sort((a, b) =>
          (a.id === UNASSIGNED) - (b.id === UNASSIGNED) || b.overdue - a.overdue || b.total - a.total);
      }, [tasks, project]);

      const projectData = useMemo(() => {
        const base = tasks.filter(t => person === 'all'
          || (person === UNASSIGNED ? t.flags.unassigned : t.assigneeIds.includes(Number(person))));
        const map = {};
        base.forEach(t => {
          const k = String(t.projectId);
          if (!map[k]) map[k] = { id: k, name: t.projectName, company: t.company, open: 0, overdue: 0, attention: 0 };
          map[k].open++;
          if (t.flags.overdue) map[k].overdue++;
          if (t.flags.attention) map[k].attention++;
        });
        return Object.values(map).sort((a, b) => b.overdue - a.overdue || b.attention - a.attention || b.open - a.open);
      }, [tasks, person]);

      const allProjects = useMemo(() => {
        const m = {};
        tasks.forEach(t => { m[t.projectId] = t.projectName; });
        return Object.entries(m).sort((a, b) => a[1].localeCompare(b[1]));
      }, [tasks]);

      const TILES = [
        { key: 'attention', label: 'Needs attention', color: '#06b6d4' },
        { key: 'overdue', label: 'Overdue', color: '#f87171' },
        { key: 'soon', label: `Due in ${DUE_SOON_DAYS + 1} days`, color: '#fbbf24' },
        { key: 'stale', label: `No change ${staleDays}+ days`, color: '#a5b4fc' },
        { key: 'unassigned', label: 'Unassigned', color: '#f472b6' },
        { key: 'nodue', label: 'No due date', color: '#94a3b8' },
        { key: 'all', label: 'All open', color: '#e2e8f0' },
      ];

      const personLabel = person === 'all' ? null : person === UNASSIGNED ? 'Unassigned' : STAFF_BY_ID[Number(person)];
      const projectLabel = project === 'all' ? null : (allProjects.find(p => String(p[0]) === project) || [])[1];

      const PeopleTooltip = ({ active, payload }) => {
        if (!active || !payload?.length) return null;
        const d = payload[0].payload;
        return (
          <div style={{ background: '#1e293b', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 8, padding: '10px 14px', fontSize: 13 }}>
            <div style={{ fontWeight: 600, marginBottom: 4 }}>{d.name}</div>
            <div style={{ color: '#f87171' }}>{d.overdue} overdue</div>
            <div style={{ color: '#fbbf24' }}>{d.soon} due soon</div>
            <div style={{ color: '#94a3b8' }}>{d.total} open in total</div>
            <div style={{ color: '#64748b', marginTop: 4, fontSize: 12 }}>Click to filter</div>
          </div>
        );
      };

      const togglePerson = id => setPerson(prev => prev === id ? 'all' : id);
      const toggleProject = id => setProject(prev => prev === id ? 'all' : id);

      return (
        <div className="dashboard">
          <div className="header">
            <div>
              <h1>☁ Team Tasks</h1>
              <div className="header-sub">Open Teamwork tasks for the team, with the ones that need attention first</div>
            </div>
            <div className="header-actions">
              {lastUpdated && <span className="last-updated">Updated {lastUpdated.toLocaleTimeString()}</span>}
              <button className="btn btn-primary" onClick={fetchData} disabled={loading}>
                {loading ? '⟳ Loading…' : '↻ Refresh'}
              </button>
            </div>
          </div>

          {error && (
            <div className="banner error">
              Couldn't load tasks: {error}. Check that <code>TEAMWORK_API_KEY</code> is set in Vercel, then press Refresh.
            </div>
          )}

          {loading && !raw.length ? (
            <div className="loading-state"><div className="spinner" /><div className="loading-text">{loadingMsg}</div></div>
          ) : !error && (
            <>
              {fieldWarning && (
                <div className="banner warn">
                  Tasks loaded, but assignees or dates came back empty, so the counts below are unreliable.
                  Open <code>/api/teamwork?endpoint=tasks.json&amp;pageSize=1</code> on this site and check the field names
                  against <code>normalise()</code> in index.html.
                </div>
              )}

              <div className="tiles" role="group" aria-label="Task filters">
                {TILES.map(t => (
                  <button key={t.key} className={`tile ${view === t.key ? 'active' : ''}`}
                    style={{ '--tile-color': t.color }} aria-pressed={view === t.key}
                    onClick={() => setView(t.key)}>
                    <div className="tile-num">{counts[t.key]}</div>
                    <div className="tile-label">{t.label}</div>
                  </button>
                ))}
              </div>

              <div className="filters">
                <div className="filter-group">
                  <label className="filter-label" htmlFor="f-person">Person</label>
                  <select id="f-person" value={person} onChange={e => setPerson(e.target.value)}>
                    <option value="all">Whole team</option>
                    {STAFF.map(s => <option key={s.id} value={String(s.id)}>{s.label}</option>)}
                    <option value={UNASSIGNED}>Unassigned</option>
                  </select>
                </div>
                <div className="filter-group">
                  <label className="filter-label" htmlFor="f-project">Project</label>
                  <select id="f-project" value={project} onChange={e => setProject(e.target.value)}>
                    <option value="all">All projects</option>
                    {allProjects.map(([id, name]) => <option key={id} value={String(id)}>{name}</option>)}
                  </select>
                </div>
                <div className="filter-group">
                  <label className="filter-label" htmlFor="f-stale">Stale after</label>
                  <select id="f-stale" value={staleDays} onChange={e => setStaleDays(Number(e.target.value))}>
                    {[3, 5, 7, 14, 30].map(n => <option key={n} value={n}>{n} days without changes</option>)}
                  </select>
                </div>
                <div className="filter-group grow">
                  <label className="filter-label" htmlFor="f-search">Search</label>
                  <input id="f-search" type="search" placeholder="Task, project, client or task list"
                    value={search} onChange={e => setSearch(e.target.value)} />
                </div>
                {(person !== 'all' || project !== 'all' || search) && (
                  <button className="btn btn-ghost" onClick={() => { setPerson('all'); setProject('all'); setSearch(''); }}>
                    Clear filters
                  </button>
                )}
              </div>

              <div className="grid-2">
                <div className="card">
                  <div className="card-title">Open tasks by person</div>
                  <div className="card-sub">Click a bar to see only that person's tasks{projectLabel ? ` · ${projectLabel}` : ''}</div>
                  <div className="legend">
                    <span><i style={{ background: COLORS.overdue }} />Overdue</span>
                    <span><i style={{ background: COLORS.soon }} />Due soon</span>
                    <span><i style={{ background: COLORS.other }} />Other open</span>
                  </div>
                  <ResponsiveContainer width="100%" height={Math.max(300, peopleData.length * 30)}>
                    <BarChart data={peopleData} layout="vertical" margin={{ left: 0, right: 20, top: 4, bottom: 4 }}
                      onClick={e => e && e.activePayload && togglePerson(e.activePayload[0].payload.id)}
                      style={{ cursor: 'pointer' }}>
                      <XAxis type="number" allowDecimals={false} tick={{ fill: '#64748b', fontSize: 12 }} axisLine={false} tickLine={false} />
                      <YAxis type="category" dataKey="name" width={120}
                        tick={{ fill: '#94a3b8', fontSize: 12 }} axisLine={false} tickLine={false} />
                      <Tooltip content={<PeopleTooltip />} cursor={{ fill: 'rgba(6,182,212,0.08)' }} />
                      <Bar dataKey="overdue" stackId="a" fill={COLORS.overdue} barSize={16}>
                        {peopleData.map(d => <Recharts.Cell key={d.id} fillOpacity={person === 'all' || person === d.id ? 1 : 0.3} />)}
                      </Bar>
                      <Bar dataKey="soon" stackId="a" fill={COLORS.soon} barSize={16}>
                        {peopleData.map(d => <Recharts.Cell key={d.id} fillOpacity={person === 'all' || person === d.id ? 1 : 0.3} />)}
                      </Bar>
                      <Bar dataKey="other" stackId="a" fill={COLORS.other} radius={[0, 4, 4, 0]} barSize={16}>
                        {peopleData.map(d => <Recharts.Cell key={d.id} fillOpacity={person === 'all' || person === d.id ? 1 : 0.3} />)}
                      </Bar>
                    </BarChart>
                  </ResponsiveContainer>
                </div>

                <div className="card">
                  <div className="card-title">Projects with the most overdue work</div>
                  <div className="card-sub">Click a project to filter{personLabel ? ` · ${personLabel}` : ''}</div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr auto auto', gap: 12, padding: '0 6px 6px', fontSize: 12, color: '#64748b' }}>
                    <span>Project</span><span style={{ minWidth: 64, textAlign: 'right' }}>Overdue</span><span style={{ minWidth: 64, textAlign: 'right' }}>Open</span>
                  </div>
                  {projectData.slice(0, 12).map(p => (
                    <button key={p.id} className={`proj-row ${project === p.id ? 'active' : ''}`} onClick={() => toggleProject(p.id)}>
                      <span className="proj-name" title={p.name}>
                        {p.name}{p.company && <div className="proj-company">{p.company}</div>}
                      </span>
                      <span className={`proj-num ${p.overdue ? 'red' : 'dim'}`}>{p.overdue}</span>
                      <span className="proj-num dim">{p.open}</span>
                    </button>
                  ))}
                  {!projectData.length && <div className="empty">No open tasks for this selection</div>}
                </div>
              </div>

              <div className="table-card">
                <div className="table-head">
                  <div className="card-title">{TILES.find(t => t.key === view).label} · {rows.length} task{rows.length === 1 ? '' : 's'}</div>
                  <div className="active-filters">
                    {personLabel && <span>Person: <strong>{personLabel}</strong></span>}
                    {projectLabel && <span>Project: <strong>{projectLabel}</strong></span>}
                  </div>
                </div>
                {rows.length ? (
                  <>
                    <div className="table-scroll">
                      <table>
                        <thead>
                          <tr><th>Task</th><th>Project</th><th>Assigned to</th><th>Due</th><th>Last change</th><th>Flags</th></tr>
                        </thead>
                        <tbody>
                          {rows.slice(0, shown).map(t => (
                            <tr key={t.id}>
                              <td style={{ minWidth: 240 }}>
                                <a className="task-link" href={taskUrl(t.id)} target="_blank" rel="noopener noreferrer">{t.name}</a>
                                {(t.listName || t.column) && <div className="task-list">{[t.listName, t.column].filter(Boolean).join(' / ')}</div>}
                              </td>
                              <td className="cell-muted" style={{ minWidth: 160 }}>
                                {t.projectName}{t.company && <div className="task-list">{t.company}</div>}
                              </td>
                              <td className="cell-muted" style={{ minWidth: 120 }}>{t.assigneeNames.join(', ') || '—'}</td>
                              <td className="nowrap">
                                {t.due ? (
                                  <span className={t.flags.overdue ? 'late' : t.flags.soon ? 'soon' : 'cell-muted'}>
                                    {fmtShort(t.due)}
                                    {t.flags.overdue && ` · ${-t.daysToDue}d late`}
                                    {t.flags.soon && (t.daysToDue === 0 ? ' · today' : t.daysToDue === 1 ? ' · tomorrow' : '')}
                                  </span>
                                ) : <span className="cell-muted">—</span>}
                              </td>
                              <td className="nowrap cell-muted">{t.lastChanged ? `${fmtShort(t.lastChanged)} (${t.idle}d)` : '—'}</td>
                              <td>
                                <div className="chips">
                                  {t.flags.overdue && <span className="chip overdue">Overdue</span>}
                                  {t.flags.soon && <span className="chip soon">Due soon</span>}
                                  {t.flags.stale && <span className="chip stale">Stale</span>}
                                  {t.flags.unassigned && <span className="chip unassigned">Unassigned</span>}
                                  {t.flags.nodue && <span className="chip nodue">No due date</span>}
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    {shown < rows.length && (
                      <div className="table-foot">
                        <button className="btn btn-ghost" onClick={() => setShown(s => s + PAGE_CHUNK)}>
                          Show {Math.min(PAGE_CHUNK, rows.length - shown)} more of {rows.length - shown} remaining
                        </button>
                      </div>
                    )}
                  </>
                ) : (
                  <div className="empty">Nothing here for this selection. Pick another tile or clear the filters.</div>
                )}
              </div>

              <div className="footer">
                Connected to <span>9cloudwebworks.teamwork.com</span>
                {` · ${tasks.length} team tasks open`}
                {outsideCount > 0 && ` · ${outsideCount} tasks assigned only to people outside the roster are hidden`}
              </div>
            </>
          )}
        </div>
      );
    }

    ReactDOM.render(<TeamTasksDashboard />, document.getElementById('root'));
  </script>
</body>
</html>
